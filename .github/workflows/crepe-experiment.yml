name: Optional CREPE comparison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODEL_CACHE: ${{ runner.temp }}/muisa-model-cache
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r experiments/crepe/requirements-linux-py312.lock
      - run: python experiments/crepe/prepare.py "$MODEL_CACHE"
      - run: node experiments/yin/generate.js
      - run: python experiments/crepe/compare.py "$MODEL_CACHE/crepe-source" tiny
      - run: python experiments/crepe/compare.py "$MODEL_CACHE/crepe-source" small
      - run: node experiments/crepe/report.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crepe-comparison
          path: |
            reports/crepe/*.json
            experiments/crepe/results.json
          retention-days: 7
